name: Synthetic agent release fixture
on:
  pull_request_target:
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    steps:
      - uses: actions/upload-artifact@v4
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "${{ github.event.comment.body }}" # synthetic inert input only
      - uses: actions/download-artifact@v4
      - run: npm publish --dry-run
