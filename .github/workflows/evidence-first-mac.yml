name: evidence-first validation (Mac self-hosted)

on:
  # No pull_request trigger: never execute untrusted PR code on a personal Mac.
  push:
    branches:
      - feature/evidence-first-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-first-feature
  cancel-in-progress: true

jobs:
  python-offline:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python version
        run: python3 --version
      - name: Compile Python helper scripts
        run: python3 -m compileall -q skills/bounty-pilot/scripts tests/test_evidence_first_lab.py
      - name: Evidence-first synthetic suite (no RPC)
        run: python3 -m unittest discover -s tests -p 'test_evidence_first_lab.py' -v
      - name: Existing stateful harness regression tests
        run: python3 -m unittest discover -s tests -p 'test_harness_gen.py' -v
      - name: Existing native loop and economic regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_research_loop.py' -v
          python3 -m unittest discover -s tests -p 'test_economic_frontier.py' -v
