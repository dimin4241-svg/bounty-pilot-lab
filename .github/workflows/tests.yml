name: tests (Mac self-hosted)

on:
  # NEVER execute untrusted public pull_request code on a personal self-hosted Mac.
  # Owners may manually start a vetted revision using workflow_dispatch.
  push:
    branches: [main, 'feat/avre-counterexample-lab-050']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python toolchain
        run: python3 --version
      - name: Compile all helper modules
        run: python3 -m compileall -q skills/bounty-pilot/scripts
      - name: Run complete synthetic unit suite
        run: python3 -m unittest discover -s tests -v

  native-smoke:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify local native test toolchains
        run: |
          export PATH="$HOME/.foundry/bin:$HOME/.cargo/bin:$PATH"
          forge --version
          cargo --version
      - name: Run synthetic Solidity and Rust tests (no target networks)
        run: |
          export PATH="$HOME/.foundry/bin:$HOME/.cargo/bin:$PATH"
          forge test --root tests/fixtures/native/evm -vv
          cargo test --manifest-path tests/fixtures/native/rust/Cargo.toml --offline
      - name: Check evidence gate on synthetic native fixtures
        run: |
          export PATH="$HOME/.foundry/bin:$HOME/.cargo/bin:$PATH"
          python3 skills/bounty-pilot/scripts/bounty.py init --repo . --out "$RUNNER_TEMP/bp-fixture-run"
          python3 skills/bounty-pilot/scripts/scenario_runner.py \
            --plan tests/fixtures/native/paired-plan.json --repo . \
            --allow-exec --out "$RUNNER_TEMP/bp-fixture-run/native-results.json"
          python3 tests/verify_native_gate.py "$RUNNER_TEMP/bp-fixture-run"
          python3 skills/bounty-pilot/scripts/bounty.py experiment-gate \
            --run "$RUNNER_TEMP/bp-fixture-run" --gate
