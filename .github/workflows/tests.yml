name: tests (GitHub-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-main
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python toolchain
        run: python3 --version
      - name: Compile all helper modules
        run: python3 -m compileall -q skills/bounty-pilot/scripts
      - name: Full synthetic unit suite
        run: python3 -m unittest discover -s tests -v

  native-smoke:
    # Strictly synthetic fixture, no RPC/secret/production contract.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Toolchain
        run: |
          forge --version
          cargo --version
      - name: Synthetic Solidity and Rust fixtures
        run: |
          forge test --root tests/fixtures/native/evm -vv
          cargo test --manifest-path tests/fixtures/native/rust/Cargo.toml --offline
      - name: Verify the synthetic native evidence gate
        run: |
          python3 skills/bounty-pilot/scripts/bounty.py init --repo . --out "$RUNNER_TEMP/bp-fixture-run"
          python3 skills/bounty-pilot/scripts/scenario_runner.py \
            --plan tests/fixtures/native/paired-plan.json --repo . \
            --allow-exec --out "$RUNNER_TEMP/bp-fixture-run/native-results.json"
          python3 tests/verify_native_gate.py "$RUNNER_TEMP/bp-fixture-run"
          python3 skills/bounty-pilot/scripts/bounty.py experiment-gate \
            --run "$RUNNER_TEMP/bp-fixture-run" --gate
