name: manual AI audit (private Mac runner)

on:
  workflow_dispatch:
    inputs:
      run_slug:
        description: 'Existing private run folder name in ~/bounty-pilot-runs'
        required: true
        type: string
      job_id:
        description: 'Existing agent_dispatch job id (job_ plus 20 hex digits)'
        required: true
        type: string
      provider:
        description: 'Already authenticated local coding-agent CLI'
        required: true
        type: choice
        default: codex
        options:
          - codex
          - claude
      model:
        description: 'Optional model ID supported by your installed CLI (leave blank for default)'
        required: false
        type: string

permissions:
  contents: read

# One manual AI audit at a time on the personal Mac. Never cancel an in-progress audit.
concurrency:
  group: manual-private-mac-ai
  cancel-in-progress: false

jobs:
  model-reading:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/target-intel-webapi-v1'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find local coding agent CLI
        run: |
          echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
          echo '/usr/local/bin' >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      - name: Run one pre-planned, read-only AI job
        shell: bash
        env:
          BP_RUN_SLUG: '${{ inputs.run_slug }}'
          BP_JOB_ID: '${{ inputs.job_id }}'
          BP_PROVIDER: '${{ inputs.provider }}'
          BP_MODEL: '${{ inputs.model }}'
        run: |
          set -euo pipefail
          umask 077
          [[ "$BP_RUN_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] || { echo 'Invalid run slug'; exit 1; }
          [[ "$BP_JOB_ID" =~ ^job_[0-9a-f]{20}$ ]] || { echo 'Invalid job id'; exit 1; }
          [[ "$BP_PROVIDER" == 'codex' || "$BP_PROVIDER" == 'claude' ]] || exit 1
          [[ -z "$BP_MODEL" || "$BP_MODEL" =~ ^[a-zA-Z0-9_.:/-]{1,100}$ ]] || { echo 'Invalid model id'; exit 1; }
          run_root="$HOME/bounty-pilot-runs"
          run_dir="$run_root/$BP_RUN_SLUG"
          [[ -d "$run_root" && ! -L "$run_root" && -d "$run_dir" && ! -L "$run_dir" && -f "$run_dir/run.json" ]] || { echo 'Existing private run missing'; exit 1; }
          command -v "$BP_PROVIDER" >/dev/null || { echo 'Install/localize CLI on Mac'; exit 1; }
          if [[ "$BP_PROVIDER" == 'codex' ]]; then codex login status >/dev/null || { echo 'Log in to Codex locally on the runner Mac'; exit 1; }; fi
          args=(run --run "$run_dir" --job-id "$BP_JOB_ID" --provider "$BP_PROVIDER" --timeout 2400)
          if [[ -n "$BP_MODEL" ]]; then args+=(--model "$BP_MODEL"); fi
          python3 "$GITHUB_WORKSPACE/skills/bounty-pilot/scripts/agent_dispatch.py" "${args[@]}"
