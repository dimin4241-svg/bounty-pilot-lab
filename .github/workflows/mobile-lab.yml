name: mobile-lab (offline synthetic)

on:
  push:
    branches: [main]
    paths:
      - 'skills/bounty-pilot/scripts/mobile_*.py'
      - 'tests/test_mobile_lab.py'
      - 'tests/test_mobile_flow.py'
      - 'tests/test_mobile_crossfile.py'
      - 'tests/test_mobile_native_probe.py'
      - 'tests/test_mobile_reachability.py'
      - '.github/workflows/mobile-lab.yml'
  pull_request:
    paths:
      - 'skills/bounty-pilot/scripts/mobile_*.py'
      - 'tests/test_mobile_lab.py'
      - 'tests/test_mobile_flow.py'
      - 'tests/test_mobile_crossfile.py'
      - 'tests/test_mobile_native_probe.py'
      - 'tests/test_mobile_reachability.py'
      - '.github/workflows/mobile-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile mobile tools
        run: python3 -m compileall -q skills/bounty-pilot/scripts/mobile_axml.py skills/bounty-pilot/scripts/mobile_lab.py skills/bounty-pilot/scripts/mobile_flow.py skills/bounty-pilot/scripts/mobile_crossfile.py skills/bounty-pilot/scripts/mobile_native_probe.py skills/bounty-pilot/scripts/mobile_reachability.py
      - name: Offline APK and IPA synthetic controls
        run: python3 -m unittest discover -s tests -p 'test_mobile*.py' -v

  android-fixture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM on disposable emulator host
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build owned Android fixture and execute candidate/control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: sh tests/fixtures/mobile-native/android/ci-run.sh
      - name: Upload bounded synthetic witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-owned-fixture-receipt
          path: ${{ runner.temp }}/bpilot-native-android.json
          if-no-files-found: ignore
          retention-days: 5

  ios-fixture:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build install and observe owned iOS Simulator fixture
        run: sh tests/fixtures/mobile-native/ios/ci-run.sh
      - name: Upload bounded synthetic witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-owned-fixture-receipt
          path: ${{ runner.temp }}/bpilot-native-ios.json
          if-no-files-found: ignore
          retention-days: 5
