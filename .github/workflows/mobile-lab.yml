name: mobile-lab (offline synthetic)

on:
  push:
    branches: [main]
    paths:
      - 'skills/bounty-pilot/scripts/mobile_*.py'
      - 'tests/test_mobile_lab.py'
      - '.github/workflows/mobile-lab.yml'
  pull_request:
    paths:
      - 'skills/bounty-pilot/scripts/mobile_*.py'
      - 'tests/test_mobile_lab.py'
      - '.github/workflows/mobile-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile mobile tools
        run: python3 -m compileall -q skills/bounty-pilot/scripts/mobile_axml.py skills/bounty-pilot/scripts/mobile_lab.py
      - name: Offline APK and IPA synthetic controls
        run: python3 -m unittest discover -s tests -p test_mobile_lab.py -v
