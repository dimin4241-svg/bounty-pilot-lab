name: portable tests (GitHub-hosted)

# Runs the synthetic unit suite on disposable GitHub-hosted runners at the oldest and a current
# supported Python. The README promises Python 3.9+; the self-hosted Mac runs whichever python3 it
# has, so a 3.9-only failure shipped in 0.52.0 unnoticed. Native target execution stays on the
# self-hosted Mac (tests.yml): nothing here runs forge, cargo or target code.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pyflakes on shipped helpers
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes skills/bounty-pilot/scripts

  unittest:
    runs-on: ubuntu-latest
    # The official interpreter images, not setup-python: newer Ubuntu runner images have no
    # Python 3.9 build, and 3.9 is the declared minimum this job exists to hold.
    container: python:${{ matrix.python-version }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify the test committer
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "portable-ci"
          git config --global user.email "portable-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - name: Compile all helper modules
        run: python -m compileall -q skills/bounty-pilot/scripts
      - name: Run complete synthetic unit suite
        run: python -m unittest discover -s tests -v
