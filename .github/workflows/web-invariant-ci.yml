name: web invariant engine synthetic tests

on:
  pull_request:
    paths:
      - 'skills/bounty-pilot/scripts/web_*.py'
      - 'skills/bounty-pilot/scripts/web_*.cjs'
      - 'skills/bounty-pilot/scripts/bounty.py'
      - 'tests/test_web_invariant_engine.py'
      - 'tests/test_web_route_ast.py'
      - 'tests/test_web_identity_nday.py'
      - 'tests/test_web_ts_ast.py'
      - 'tests/test_web_ts_flow.py'
      - 'tests/test_web_http_boundary.py'
      - 'tests/test_web_bench_ab.py'
      - 'tests/test_web_phase3.py'
      - 'tests/test_web_effect_fixture_replay.py'
      - 'tests/test_web_native_toolchain.py'
      - 'tests/test_web_benchmark_readiness.py'
      - 'tests/test_web_hunt_loop.py'
      - 'skills/bounty-pilot/references/web-hunt-loop-phase5.md'
      - 'skills/bounty-pilot/references/web-native-phase4.md'
      - '.github/workflows/web-invariant-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile helper scripts
        run: |
          python3 -m py_compile skills/bounty-pilot/scripts/web_invariant_engine.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_local_replay.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_route_ast.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_identity_flow.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_nday_regression.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_ts_ast.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_ts_flow.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_http_boundary.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_bench_ab.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_program_policy.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_actor_state_graph.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_effect_oracle.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_effect_fixture_replay.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_native_toolchain.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_benchmark_regression.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_benchmark_readiness.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_workflow_capture.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_hunt_loop.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_dispatch_prepare.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_evidence_packet.py
          node --check skills/bounty-pilot/scripts/web_playwright_local.cjs
          python3 -m py_compile skills/bounty-pilot/scripts/web_browser_trust_graph.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_parser_lab.py
          python3 -m py_compile skills/bounty-pilot/scripts/web_root_cause_dedup.py
          node --check skills/bounty-pilot/scripts/web_ts_flow_parser.cjs
      - name: Synthetic offline and loopback-only checks
        run: |
          python3 -m unittest discover -s tests -p 'test_web_invariant_engine.py' -v
          python3 -m unittest discover -s tests -p 'test_web_route_ast.py' -v
          python3 -m unittest discover -s tests -p 'test_web_identity_nday.py' -v
          python3 -m unittest discover -s tests -p 'test_web_ts_ast.py' -v
          python3 -m unittest discover -s tests -p 'test_web_ts_flow.py' -v
          python3 -m unittest discover -s tests -p 'test_web_http_boundary.py' -v
          python3 -m unittest discover -s tests -p 'test_web_bench_ab.py' -v
          python3 -m unittest discover -s tests -p 'test_web_phase3.py' -v
          python3 -m unittest discover -s tests -p 'test_web_effect_fixture_replay.py' -v
          python3 -m unittest discover -s tests -p 'test_web_native_toolchain.py' -v
          python3 -m unittest discover -s tests -p 'test_web_benchmark_readiness.py' -v
          python3 -m unittest discover -s tests -p 'test_web_hunt_loop.py' -v
      - name: Pinned TypeScript parser fixture (no install scripts)
        run: |
          npm install --prefix "$RUNNER_TEMP/bp-ts-parser" --ignore-scripts --no-audit --no-fund --save-exact typescript@5.9.3
          BP_TYPESCRIPT_PARSER="$RUNNER_TEMP/bp-ts-parser/node_modules/typescript/lib/typescript.js" \
            python3 -m unittest discover -s tests -p 'test_web_ts_ast.py' -v
          BP_TYPESCRIPT_PARSER="$RUNNER_TEMP/bp-ts-parser/node_modules/typescript/lib/typescript.js" \
            python3 -m unittest discover -s tests -p 'test_web_ts_flow.py' -v
      - name: CLI smoke
        run: |
          python3 skills/bounty-pilot/scripts/bounty.py web-invariants --help
          python3 skills/bounty-pilot/scripts/bounty.py web-route-ast --help
          python3 skills/bounty-pilot/scripts/bounty.py web-ts-ast --help
          python3 skills/bounty-pilot/scripts/bounty.py web-ts-flow --help
          python3 skills/bounty-pilot/scripts/bounty.py web-http-boundary --help
          python3 skills/bounty-pilot/scripts/bounty.py web-bench-ab --help
          python3 skills/bounty-pilot/scripts/bounty.py web-program-policy --help
          python3 skills/bounty-pilot/scripts/bounty.py web-actor-state-graph --help
          python3 skills/bounty-pilot/scripts/bounty.py web-effect-oracle --help
          python3 skills/bounty-pilot/scripts/bounty.py web-effect-fixture-replay --help
          python3 skills/bounty-pilot/scripts/bounty.py web-native-toolchain --help
          python3 skills/bounty-pilot/scripts/bounty.py web-benchmark-regression --help
          python3 skills/bounty-pilot/scripts/bounty.py web-benchmark-readiness --help
          python3 skills/bounty-pilot/scripts/bounty.py web-workflow-capture --help
          python3 skills/bounty-pilot/scripts/bounty.py web-hunt-loop --help
          python3 skills/bounty-pilot/scripts/bounty.py web-dispatch-prepare --help
          python3 skills/bounty-pilot/scripts/bounty.py web-evidence-packet --help
          python3 skills/bounty-pilot/scripts/bounty.py web-browser-trust --help
          python3 skills/bounty-pilot/scripts/bounty.py web-parser-lab --help
          python3 skills/bounty-pilot/scripts/bounty.py web-root-cause-dedup --help
          python3 skills/bounty-pilot/scripts/bounty.py web-identity-flow --help
          python3 skills/bounty-pilot/scripts/bounty.py web-nday-review --help
          python3 skills/bounty-pilot/scripts/bounty.py web-local-replay --help
