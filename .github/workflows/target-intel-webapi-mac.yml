name: target intelligence offline validation (GitHub-hosted)

on:
  # No Mac is needed for these entirely synthetic unit tests.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile new helpers and tests
        run: |
          python3 -m py_compile skills/bounty-pilot/scripts/program_scope_radar.py \
            skills/bounty-pilot/scripts/js_change_intel.py \
            skills/bounty-pilot/scripts/web_auth_lab.py \
            skills/bounty-pilot/scripts/api_surface_import.py \
            skills/bounty-pilot/scripts/target_intel_queue.py \
            tests/test_target_intel_webapi.py
      - name: New synthetic offline tests
        run: python3 -m unittest discover -s tests -p 'test_target_intel_webapi.py' -v
      - name: Evidence-first offline unit tests
        run: python3 -m unittest discover -s tests -p 'test_evidence_first_lab.py' -v
