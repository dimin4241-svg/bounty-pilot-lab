name: Research admin unit tests
on:
  push:
    paths:
      - 'research_admin/**'
      - '.github/workflows/research-admin-tests.yml'
  pull_request:
    paths:
      - 'research_admin/**'
      - '.github/workflows/research-admin-tests.yml'
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check release metadata and tracked private filenames
        run: python research_admin/release_check.py
      - run: python -m unittest discover -s research_admin -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
